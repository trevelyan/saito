<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>Option A Home header</title>
<link rel="stylesheet" href="http://127.0.0.1:12101/saito/lib/font-awesome-6/css/fontawesome.min.css"/>
<link rel="stylesheet" href="http://127.0.0.1:12101/saito/lib/font-awesome-6/css/solid.min.css"/>
<link rel="stylesheet" href="http://127.0.0.1:12101/saito/saito.css"/>
<link rel="stylesheet" href="http://127.0.0.1:12101/redsquare/style.css"/>
<style>
  html { font-size: 12px; }
  body { margin: 0; background: #090a09; color: var(--saito-foreground); }
  .frame { width: 620px; margin: 28px auto; }
  .label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #6a665e; margin: 0 0 10px; }
  .panel { border: 1px solid var(--saito-border); border-radius: 8px; overflow: hidden; }
  /* Before: small CTA, regular title, taller empty header, lg pad, full tweet top pad */
  .before .manager > .header {
    min-height: 5.6rem !important;
    padding: 0 var(--saito-space-lg) !important;
    gap: var(--saito-space-sm) !important;
  }
  .before .manager > .header .title {
    font-family: var(--saito-font-medium) !important;
    font-size: 1.67rem !important;
  }
  .before .new-post.compact { display: none !important; }
  .before .tweet { padding-top: var(--saito-space-md) !important; }
  .tweet .avatar {
    width: 3.5rem; height: 3.5rem; border-radius: 50%; background: #3a3a38;
  }
</style>
</head>
<body class="redsquare-body">
  <div class="frame before">
    <p class="label">Before — .small Post, regular title, tall empty header</p>
    <div class="panel">
      <div class="manager">
        <header class="header">
          <div class="start"><h2 class="title">Home</h2></div>
          <div class="actions">
            <button class="new-post saito-button-primary small" type="button"><i class="fa-solid fa-plus"></i><span>Post</span></button>
          </div>
        </header>
        <div class="body">
          <article class="tweet">
            <div class="avatar"></div>
            <div class="content">
              <header class="header compact"><span class="primary">Display Name</span><span class="sep">·</span><span class="time">2h</span></header>
              <div class="body">First post in the feed — title should introduce this naturally.</div>
            </div>
          </article>
        </div>
      </div>
    </div>
  </div>

  <div class="frame after">
    <p class="label">After — Option A: heavy title, compact CTA, tighter header → feed</p>
    <div class="panel">
      <div class="manager">
        <header class="header">
          <div class="start"><h2 class="title">Home</h2></div>
          <div class="actions">
            <button class="new-post saito-button-primary compact" type="button"><i class="fa-solid fa-plus"></i><span>Post</span></button>
          </div>
        </header>
        <div class="body">
          <article class="tweet">
            <div class="avatar"></div>
            <div class="content">
              <header class="header compact"><span class="primary">Display Name</span><span class="sep">·</span><span class="time">2h</span></header>
              <div class="body">First post in the feed — title should introduce this naturally.</div>
            </div>
          </article>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
