<!DOCTYPE html>
<html data-theme="dark"><head>
<link rel="stylesheet" href="http://127.0.0.1:12101/saito/saito.css"/>
<link rel="stylesheet" href="http://127.0.0.1:12101/redsquare/style.css"/>
</head>
<body class="redsquare-body" style="padding:2rem"><style>html{font-size:12px!important}</style>
<header class="manager"><div class="header"><h2 class="title">Home</h2></div></header>
<div class="chat-manager"><div class="saito-sidebar-header"><div class="title">Chats</div></div></div>
<div class="sidebar"><div class="redsquare-leaderboard"><div class="saito-sidebar-header"><div class="title">Leaderboard</div></div></div>
<div class="sidebar"><div class="saito-sidebar-header"><div class="title">Who to follow</div></div></div>
<article class="tweet"><span class="primary">Name</span><div class="body">Body text here</div><span class="time">2h</span>
<div class="controls"><div class="tool"><i class="fa-solid fa-heart"></i><span class="count">12</span></div></div>
</article>
</div><nav class="menu"><div class="item"><div class="icon"><i class="fa-solid fa-house"></i></div><div class="label">Home</div></div></nav>
<script>
document.fonts.ready.then(() => {
  const picks = [
    ['.manager .header .title','Home title'],
    ['.chat-manager .saito-sidebar-header','Chat header'],
    ['.chat-manager .saito-sidebar-header .title','Chat title'],
    ['.redsquare-leaderboard .saito-sidebar-header','LB header'],
    ['.sidebar .saito-sidebar-header','WTF header'],
    ['.tweet .primary','Tweet name'],
    ['.tweet .body','Tweet body'],
    ['.tweet .time','Tweet time'],
    ['.tweet .controls .count','Count'],
    ['.tweet .controls .tool i','Control icon'],
    ['.menu .label','Nav label'],
    ['.menu .icon i','Nav icon'],
  ];
  const out = picks.map(([sel,label]) => {
    const el = document.querySelector(sel);
    if (!el) return label+': MISSING';
    const cs = getComputedStyle(el);
    return [
      label,
      'size='+cs.fontSize,
      'family='+cs.fontFamily.split(',')[0].replace(/['"]/g,''),
      'weight='+cs.fontWeight,
      'lh='+cs.lineHeight,
      'color='+cs.color,
      'tt='+cs.textTransform,
      'ls='+cs.letterSpacing
    ].join(' | ');
  });
  document.body.innerHTML = '<pre style="font:12px/1.5 monospace;color:#eee;white-space:pre-wrap">'+out.join('\n')+'</pre>';
});
</script>
</body></html>
